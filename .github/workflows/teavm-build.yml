
name: TeaVM JavaScript Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Generate JavaScript
        run: ./gradlew :teavm:generateJavaScript --no-daemon --console=plain

      - name: Package generated output
        if: success()
        run: |
          find . -type f \( -name '*.js' -o -name '*.wasm' \) -size +10M -print0 |
            tar --null -czf teavm-output.tar.gz --files-from=- || true

      - name: Upload generated output
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: teavm-generated-output
          path: teavm-output.tar.gz
          if-no-files-found: warn
          retention-days: 7
