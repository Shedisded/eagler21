<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<title>minecraft-1.21.11-port (TeaVM)</title>
	<style>
		html, body { margin: 0; padding: 0; background: #000; overflow: hidden; }
		#gameCanvas { display: block; width: 100vw; height: 100vh; }
	</style>
</head>
<body>
	<canvas id="gameCanvas" width="1280" height="720"></canvas>
	<script>
		// TeaVM UMD module exports main(); it does not auto-run.
		window.addEventListener('error', e => console.error('[window error]', e.message));
	</script>
	<script src="classes.js"></script>
	<script>
		// Fetch the vanilla resource zip and hand it to the TeaVM boot as an Int8Array
		// (EaglerAssets.install reads window.__EAGLER_ZIP and unzips it into the VFS)
		// BEFORE running main([]).
		fetch('vanilla-assets.zip')
			.then(r => r.ok ? r.arrayBuffer() : Promise.reject('zip ' + r.status))
			.then(buf => { window.__EAGLER_ZIP = new Int8Array(buf); console.log('[boot] fetched vanilla-assets.zip ' + buf.byteLength + ' bytes'); })
			.catch(e => console.warn('[boot] no vanilla-assets.zip (' + e + '); booting without assets'))
			.finally(() => {
				try { main([]); } catch (e) { console.error('[main threw]', e && e.stack || e); }
			});
	</script>
</body>
</html>
